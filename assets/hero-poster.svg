<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">Nospaceのデモ</title>
  <desc id="desc">ローマ字入力から自然な日本語候補を表示する入力パネル</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#444444"/>
      <stop offset="1" stop-color="#111111"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" flood-color="#000000" flood-opacity=".35" stdDeviation="24"/>
    </filter>
  </defs>
  <rect width="1280" height="800" fill="#111111"/>
  <circle cx="1040" cy="150" r="180" fill="none" stroke="#aaaaaa" stroke-opacity=".18"/>
  <circle cx="1040" cy="150" r="204" fill="none" stroke="#aaaaaa" stroke-opacity=".08"/>
  <path d="M34 34h38M34 34v38M1246 766h-38M1246 766v-38" fill="none" stroke="#aaaaaa" stroke-width="2"/>
  <g filter="url(#shadow)" transform="translate(280 118)">
    <rect width="720" height="560" rx="28" fill="#111111" fill-opacity=".9" stroke="#ffffff" stroke-opacity=".16"/>
    <path d="M0 66h720" stroke="#ffffff" stroke-opacity=".14"/>
    <circle cx="27" cy="33" r="6" fill="#777777"/>
    <circle cx="49" cy="33" r="6" fill="#ffffff" fill-opacity=".26"/>
    <circle cx="71" cy="33" r="6" fill="#ffffff" fill-opacity=".26"/>
    <text x="360" y="38" fill="#ffffff" fill-opacity=".7" font-family="Hiragino Sans GB" font-size="14" text-anchor="middle">Nospace</text>
    <text x="644" y="38" fill="#aaaaaa" font-family="Hiragino Sans GB" font-size="13" text-anchor="end">日本語 ⌄</text>
    <text x="58" y="126" fill="#ffffff" fill-opacity=".46" font-family="Menlo" font-size="12" letter-spacing="2">INPUT</text>
    <text x="58" y="166" fill="#ffffff" fill-opacity=".78" font-family="Menlo" font-size="24">ashitanokaiginosiryowo</text>
    <rect x="58" y="187" width="3" height="30" fill="#777777"/>
    <path d="M58 244h604" stroke="#ffffff" stroke-opacity=".14"/>
    <rect x="58" y="268" width="604" height="55" rx="7" fill="#aaaaaa" fill-opacity=".12" stroke="#aaaaaa" stroke-opacity=".4"/>
    <text x="79" y="302" fill="#aaaaaa" font-family="Menlo" font-size="12">01</text>
    <text x="125" y="303" fill="#ffffff" font-family="Hiragino Sans GB" font-size="22">明日の会議の資料を</text>
    <text x="635" y="302" fill="#aaaaaa" font-family="Menlo" font-size="18" text-anchor="end">✓</text>
    <text x="79" y="359" fill="#aaaaaa" fill-opacity=".62" font-family="Menlo" font-size="11">02</text>
    <text x="125" y="360" fill="#ffffff" fill-opacity=".52" font-family="Hiragino Sans GB" font-size="18">明日の会議資料を</text>
    <text x="79" y="408" fill="#aaaaaa" fill-opacity=".62" font-family="Menlo" font-size="11">03</text>
    <text x="125" y="409" fill="#ffffff" fill-opacity=".52" font-family="Hiragino Sans GB" font-size="18">明日の会議の資料について</text>
    <text x="58" y="500" fill="#ffffff" fill-opacity=".42" font-family="Menlo" font-size="11">↑↓ 選択　　↩ 挿入　　esc 閉じる</text>
  </g>
</svg>
