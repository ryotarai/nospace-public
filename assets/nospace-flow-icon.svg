<?xml version="1.0" encoding="UTF-8"?>
<!--
  Menu bar outline derived from Resources/AppIcon.svg#Motif.
  The application background, gradients, glows, and shadow are intentionally
  excluded so AppKit can render this as a monochrome template image.
-->
